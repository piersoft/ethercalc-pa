{% extends "base.html" %}{% block title %}Cambia password{% endblock %}
{% block body %}
<h1>Cambia password</h1>
<form class="panel" method="post" action="{{ p }}/gw/password" style="max-width:480px;display:grid;gap:1rem">
  <input type="hidden" name="csrf" value="{{ sess.csrf }}">
  <div><label for="o">Password attuale</label><input id="o" type="password" name="old" autocomplete="current-password" required></div>
  <div><label for="n">Nuova password (almeno 12 caratteri)</label><input id="n" type="password" name="new" minlength="12" autocomplete="new-password" required></div>
  <div><label for="n2">Ripeti la nuova password</label><input id="n2" type="password" name="new2" minlength="12" autocomplete="new-password" required></div>
  <button>Salva la nuova password</button>
</form>
{% endblock %}
