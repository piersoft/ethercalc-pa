    # ===== EtherCalc protetto da gateway (aggiunto per /sheet) =====
    set $ec_upstream http://ethercalc:8000;
    set $gw_upstream http://gateway:9000;

    # Sottorichiesta di autorizzazione: non raggiungibile dall'esterno.
    location = /_sheet_check {
        internal;
        rewrite ^ /internal/check break;
        proxy_pass $gw_upstream;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
    }
    location @sheet_login { return 302 /sheet/gw/login; }

    location = /sheet  { return 301 /sheet/; }
    location = /sheet/ { return 302 /sheet/gw/; }

    # Interfaccia del gateway: login, dashboard, amministrazione.
    location /sheet/gw/ {
        rewrite ^/sheet(/.*)$ $1 break;
        proxy_pass $gw_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /sheet/internal/ { return 404; }

    # SocialCalc chiede le proprie icone alla radice del dominio
    # (`defaultImagePrefix = "/images/sc_"`, percorso assoluto nel client):
    # le si serve da EtherCalc, senza toccare il resto di CKAN.
    location ~ ^/images/sc[-_] {
        proxy_pass $ec_upstream;
        proxy_set_header Host $http_host;
    }

    # Risorse statiche di EtherCalc: nessun dato utente, nessun controllo.
    location ~ "^/sheet/(?:[^/]+/)?(?:static|images|l10n|multi)/" {
        rewrite "^/sheet/(?:[^/]+/)?((?:static|images|l10n|multi)/.*)$" /$1 break;
        proxy_pass $ec_upstream;
        proxy_set_header Host $http_host;
    }
    location ~ "^/sheet/(?:[^/]+/)?(?:favicon[^/]*|apple-touch-icon\.png|android-chrome-192x192\.png|mstile-[^/]+|safari-pinned-tab\.svg|browserconfig\.xml|manifest\.json|manifest\.appcache|robots\.txt)$" {
        rewrite "^/sheet/(?:[^/]+/)?(.*)$" /$1 break;
        proxy_pass $ec_upstream;
        proxy_set_header Host $http_host;
    }

    # WebSocket di editing: sessione valida e proprieta' del foglio.
    location /sheet/_ws/ {
        auth_request /_sheet_check;
        rewrite ^/sheet(/.*)$ $1 break;
        proxy_pass $ec_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Interfaccia del foglio: come sopra, piu' un collegamento di ritorno
    # alla dashboard iniettato in coda alla pagina. Il filtro agisce solo
    # su text/html e la pagina del foglio e' l'unica servita qui; gli
    # export (.csv, .json, .xlsx, .ods) non sono toccati.
    location ~ "^/sheet/(?!.*\.(?:csv|csv\.json|html|md|xlsx|ods|fods)$)[^/]+(?:/(?:edit|view|app))?$" {
        auth_request /_sheet_check;
        error_page 401 = @sheet_login;
        rewrite ^/sheet(/.*)$ $1 break;
        proxy_pass $ec_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        sub_filter_once on;
        sub_filter '</body>' '<style>[id*=clipboardtab]{display:none!important}</style><a href="/sheet/gw/" target="_self" style="position:fixed;left:12px;bottom:12px;z-index:2147483647;background:#0066cc;color:#fff;font:600 14px/1 system-ui,sans-serif;padding:10px 14px;border-radius:4px;text-decoration:none;box-shadow:0 2px 6px rgba(0,0,0,.3)">&#8592; I miei fogli</a></body>';
    }

    # Export pubblici, interfaccia del foglio, API REST: decide il gateway.
    location /sheet/ {
        auth_request /_sheet_check;
        error_page 401 = @sheet_login;
        rewrite ^/sheet(/.*)$ $1 break;
        proxy_pass $ec_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
